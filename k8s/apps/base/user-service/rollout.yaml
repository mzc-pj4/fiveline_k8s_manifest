apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: user-service
  namespace: fiveline
  labels:
    app: user-service
    project: fiveline
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 2m}
        - setWeight: 30
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {}
  template:
    metadata:
      labels:
        app: user-service
        project: fiveline
    spec:
      serviceAccountName: user-service-sa
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          image: 089955620282.dkr.ecr.ap-northeast-2.amazonaws.com/fiveline/user-service:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: fiveline-secret
          securityContext:
            readOnlyRootFilesystem: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - user-service
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: user-service
          image: 089955620282.dkr.ecr.ap-northeast-2.amazonaws.com/fiveline/user-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          envFrom:
            - secretRef:
                name: fiveline-secret
          env:
            - name: SERVICE_NAME
              value: "user-service"
            - name: PORT
              value: "8000"
            - name: TZ
              value: "Asia/Seoul"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
