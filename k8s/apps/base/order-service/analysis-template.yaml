apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: order-service-canary-analysis
  namespace: fiveline
spec:
  metrics:
    - name: error-rate
      count: 1
      failureLimit: 0
      successCondition: result == "Successful"
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: canary-checker
                    image: python:3.11-slim
                    command:
                      - python3
                      - -c
                      - |
                        import urllib.request, sys, time

                        url = "http://order-service-canary.fiveline.svc.cluster.local:8003/api/health"
                        total = 20
                        errors = 0

                        for i in range(total):
                            try:
                                res = urllib.request.urlopen(url, timeout=5)
                                if res.status >= 500:
                                    errors += 1
                            except Exception:
                                errors += 1
                            if i < total - 1:
                                time.sleep(0.5)

                        rate = errors / total * 100
                        print(f"Canary error rate: {rate:.1f}% ({errors}/{total} failed)")

                        if rate > 5.0:
                            print(f"FAIL: {rate:.1f}% exceeds 5% threshold - triggering auto rollback")
                            sys.exit(1)

                        print(f"PASS: {rate:.1f}% within threshold")
                        sys.exit(0)
