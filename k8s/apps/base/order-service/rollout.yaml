apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
  namespace: fiveline
  labels:
    app: order-service
    project: fiveline
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    notifications.argoproj.io/subscribe.on-rollout-completed.slack: deployment-alerts
    notifications.argoproj.io/subscribe.on-rollout-aborted.slack: deployment-alerts
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: order-service-canary-analysis
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 30
        - pause: {duration: 2m}
        - analysis:
            templates:
              - templateName: order-service-canary-analysis
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {}
        - analysis:
            templates:
              - templateName: order-service-canary-analysis
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
  template:
    metadata:
      labels:
        app: order-service
        project: fiveline
    spec:
      serviceAccountName: order-service-sa
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          image: 089955620282.dkr.ecr.ap-northeast-2.amazonaws.com/fiveline/order-service:dev-104-45edac631231c1ffacedba1ae7ad7fc2bb1e61cd
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: fiveline-secret
          securityContext:
            readOnlyRootFilesystem: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - order-service
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: order-service
          image: 089955620282.dkr.ecr.ap-northeast-2.amazonaws.com/fiveline/order-service:dev-104-45edac631231c1ffacedba1ae7ad7fc2bb1e61cd
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8003
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          envFrom:
            - secretRef:
                name: fiveline-secret
          env:
            - name: SERVICE_NAME
              value: "order-service"
            - name: PORT
              value: "8003"
            - name: TZ
              value: "Asia/Seoul"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8002"
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
