---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-user-service
  namespace: fiveline
spec:
  podSelector:
    matchLabels:
      app: user-service
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.0.0/23
      ports:
        - protocol: TCP
          port: 8000
---
