apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token
  template.app-sync-succeeded: |
    slack:
      attachments: |
        [{
          "color": "#18be52",
          "title": "✅ {{ .app.metadata.name }} 배포 완료",
          "fields": [
            {"title": "환경", "value": "dev", "short": true},
            {"title": "버전", "value": "{{ .app.status.sync.revision | truncate 7 }}", "short": true},
            {"title": "상태", "value": "Synced & Healthy", "short": false}
          ],
          "footer": "ArgoCD Notification",
          "ts": "{{ now | unixEpoch }}"
        }]
  template.app-sync-failed: |
    slack:
      attachments: |
        [{
          "color": "#E96D76",
          "title": "❌ {{ .app.metadata.name }} 배포 실패",
          "fields": [
            {"title": "환경", "value": "dev", "short": true},
            {"title": "메시지", "value": "{{ .app.status.conditions | map (attr \"message\") | join \"\n\" }}", "short": false}
          ],
          "footer": "ArgoCD Notification",
          "ts": "{{ now | unixEpoch }}"
        }]
  template.app-health-degraded: |
    slack:
      attachments: |
        [{
          "color": "#f4c030",
          "title": "⚠️ {{ .app.metadata.name }} 헬스 이상 감지",
          "fields": [
            {"title": "상태", "value": "{{ .app.status.health.status }}", "short": true},
            {"title": "메시지", "value": "{{ .app.status.health.message }}", "short": false}
          ],
          "footer": "ArgoCD Notification",
          "ts": "{{ now | unixEpoch }}"
        }]
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      send: [app-sync-succeeded]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
  subscriptions: |
    - recipients:
        - slack:deployment-alerts
      triggers:
        - on-sync-succeeded
        - on-sync-failed
        - on-health-degraded
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  slack-token: "REPLACE_WITH_SLACK_BOT_TOKEN"
