apiVersion: v1
kind: ConfigMap
metadata:
  name: fiveline-backend-config
  namespace: fiveline
data:
  ENVIRONMENT: dev
  LOG_LEVEL: INFO
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: "60"
  PRODUCT_SERVICE_URL: http://product-service:8000
  PRODUCT_SERVICE_TIMEOUT_S: "3.0"
  FAILURE_RATE: "0.05"
  SLOW_RATE: "0.03"
  SLOW_RESPONSE_MS_MIN: "1500"
  SLOW_RESPONSE_MS_MAX: "3500"

