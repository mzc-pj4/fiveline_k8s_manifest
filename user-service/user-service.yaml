apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fiveline
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 089955620282.dkr.ecr.ap-northeast-2.amazonaws.com/fiveline-ecr/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fiveline-backend-config
            - secretRef:
                name: fiveline-backend-secret
          env:
            - name: SERVICE_NAME
              value: user-service
            - name: DB_SCHEMA
              value: user_schema
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: fiveline
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000

